<!doctype html>
<html lang="en">
  <head>
<script>/*sso-accept-v3*/
(function(){
  var API='https://codsy.ai';
  try{
    var m=(location.hash||'').match(/[#&]sso=([^&]+)/);
    if(m){
      var s=m[1].replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='=';
      var d=JSON.parse(decodeURIComponent(escape(atob(s))));
      if(d&&d.a){
        localStorage.setItem('access_token',d.a);
        if(d.r)localStorage.setItem('refresh_token',d.r);
        if(d.u)localStorage.setItem('user',typeof d.u==='string'?d.u:JSON.stringify(d.u));
        if(d.ent)localStorage.setItem('codsy_entitlement',d.ent);
        localStorage.removeItem('persist:root');
        location.replace('/dashboard');
        return;
      }
    }
  }catch(e){}
  function badge(plan,remaining){
    var el=document.getElementById('codsy-ent-badge');
    if(!el){el=document.createElement('div');el.id='codsy-ent-badge';
      el.style.cssText='position:fixed;bottom:14px;right:14px;z-index:99999;background:#12131b;border:1px solid rgba(124,58,237,.5);color:#e5e7eb;border-radius:999px;padding:7px 14px;font:12px/1.2 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5)';
      (document.body||document.documentElement).appendChild(el);}
    el.innerHTML='<span style="color:#a78bfa;font-weight:700">Codsy</span> &middot; '+(plan||'free')+' &middot; '+Number(remaining||0).toLocaleString()+' tokens left';
  }
  function fromStored(){try{var ent=localStorage.getItem('codsy_entitlement');if(!ent)return null;var p=ent.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');while(p.length%4)p+='=';return JSON.parse(decodeURIComponent(escape(atob(p))));}catch(e){return null;}}
  function render(){var b=fromStored();if(b)badge(b.plan,b.remaining);}
  if(document.body)render();else document.addEventListener('DOMContentLoaded',render);
  try{
    var tok=localStorage.getItem('access_token');if(!tok)return;
    fetch(API+'/api/entitlement/live',{headers:{Authorization:'Bearer '+tok}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){if(!d||!d.entitlement)return;localStorage.setItem('codsy_entitlement',d.entitlement);badge(d.plan,d.remaining);})
      .catch(function(){});
  }catch(e){}
})();
</script>
